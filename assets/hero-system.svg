<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">AI operations systems concept</title><desc id="desc">Abstract technical visualization of AI, CRM, workflow automation and communications systems connected through an orchestration layer.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#292824"/><stop offset=".55" stop-color="#41403c"/><stop offset="1" stop-color="#170d0a"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#d08856" stop-opacity=".55"/><stop offset=".55" stop-color="#aa210f" stop-opacity=".16"/><stop offset="1" stop-color="#aa210f" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffeed6" stop-opacity=".9"/><stop offset="1" stop-color="#d08856" stop-opacity=".35"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="28"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1260" cy="210" r="390" fill="url(#glow)" filter="url(#blur)"/><circle cx="300" cy="850" r="300" fill="#aa210f" opacity=".08" filter="url(#blur)"/><g fill="none" stroke="url(#line)" stroke-width="2" opacity=".6"><path d="M140 250H520L690 420H960L1110 260H1450"/><path d="M210 700H520L700 530H980L1210 730H1460"/><path d="M520 250L700 420V530L520 700"/><path d="M1110 260L980 420V530L1210 730"/></g><g fill="#ffeed6" stroke="#d08856" stroke-width="2"><rect x="100" y="190" width="330" height="150" rx="24" fill="#292824"/><rect x="1170" y="180" width="330" height="150" rx="24" fill="#292824"/><rect x="150" y="650" width="330" height="150" rx="24" fill="#292824"/><rect x="1120" y="660" width="330" height="150" rx="24" fill="#292824"/><rect x="640" y="365" width="330" height="210" rx="32" fill="#aa210f" stroke="#ffeed6" stroke-opacity=".65"/></g><g font-family="Arial,Helvetica,sans-serif"><g fill="#ffeed6" font-size="26" font-weight="700"><text x="140" y="245">CRM / DATA</text><text x="1210" y="235">COMMUNICATIONS</text><text x="190" y="705">WORKFLOWS</text><text x="1160" y="715">ANALYTICS</text><text x="700" y="445">AI ORCHESTRATION</text></g><g fill="#d9d3cc" font-size="18"><text x="140" y="285">records · events · APIs</text><text x="1210" y="275">voice · SMS · email</text><text x="190" y="745">triggers · routing · logic</text><text x="1160" y="755">KPIs · signals · insight</text><text x="700" y="485">real-time decision layer</text><text x="700" y="520">connect → transform → act</text></g></g><g fill="#ffeed6"><circle cx="520" cy="250" r="8"/><circle cx="700" cy="420" r="8"/><circle cx="980" cy="420" r="8"/><circle cx="1110" cy="260" r="8"/><circle cx="520" cy="700" r="8"/><circle cx="700" cy="530" r="8"/><circle cx="980" cy="530" r="8"/><circle cx="1210" cy="730" r="8"/></g><text x="100" y="920" fill="#d08856" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="5">ENGINEERING SMARTER SYSTEMS</text></svg>